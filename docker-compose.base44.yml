services:
  web:
    image: nginx:alpine
    restart: on-failure
    labels:
      base44.project: "VARD · RH Informa ADP"
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/base44-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/adp-video.html || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s
