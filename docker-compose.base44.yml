# Ambiente de desenvolvimento Base44 (preview).
# Site estatico: o nginx serve o repositorio direto do bind mount,
# entao qualquer edicao em index.html / game-mode/*.sh aparece na hora.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.base44.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
