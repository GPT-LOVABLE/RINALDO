# Base44 sandbox/dev environment for RINALDO (static single-page app).
# Serves the repo's index.html straight from the bind-mounted working tree, so
# edits are visible after a browser refresh (no build step exists in this project).
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "RINALDO"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
