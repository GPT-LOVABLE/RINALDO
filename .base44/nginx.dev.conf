# Sandbox-only nginx config for the static RINALDO app.
# Runs the workers as root because the sandbox checkout is owned by root with
# restrictive permissions; serves the bind-mounted repo uncached so source edits
# show up on refresh. Not used in production.
user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
