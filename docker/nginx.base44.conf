# Config completa do nginx para o preview Base44.
# worker como root: o bind mount do repositorio chega com permissao 700
# (dono root) no sandbox, e o worker padrao (usuario nginx) nao consegue
# atravessar o diretorio. Isso vale apenas para o container de desenvolvimento.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    charset utf-8;

    server {
        listen 80 default_server;
        root /usr/share/nginx/html;
        index index.html;

        # nao serve arquivos ocultos (.git, .base44)
        location ~ /\. {
            deny all;
        }

        # preview sempre com o conteudo mais recente
        location ~ \.html$ {
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
